name: Legacy package check

on:
  push:
    branches: [split/middleware-legacy]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/middleware-legacy
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer update --no-interaction --prefer-dist
      - run: composer audit --locked --no-dev
      - run: composer check
